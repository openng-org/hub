name: Bug report
description: Something on the site does not work as it should.
title: 'bug: '
labels: ['bug']
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://hub.openng.org/…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots help, especially for layout or dark-mode issues.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 150 on macOS, Safari on iPhone, dark mode…
