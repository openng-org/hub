name: Links

# The datasets link to event pages, communities and documentation that move or disappear. Once a
# week, every URL in them is checked; a failing run lists the dead ones in the job summary.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Sites that answer bots with a challenge page are skipped; 429 is "slow down", not dead.
          args: >-
            --no-progress
            --cache --max-cache-age 1d
            --max-concurrency 8
            --accept 200..=206,429
            --exclude 'x\.com' --exclude 'twitter\.com' --exclude 'linkedin\.com'
            --exclude 'meetup\.com' --exclude 'facebook\.com' --exclude 'instagram\.com'
            --exclude 'lu\.ma'
            'packages/*/data/**/*.json'
            'packages/data-caniuse/src/**/*.ts'
            'packages/data-releases/src/**/*.ts'
            'packages/data-angular-mcp/src/**/*.ts'
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
