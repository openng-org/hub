<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Angular Hub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Community-driven data and tools for the Angular ecosystem: events, communities, podcasts, feature support per version and release insights."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme before first paint: the visitor's choice (core/theme.ts), else the OS setting. -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('hub-theme');
          var dark = choice
            ? choice === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('hub-dark', dark);
        } catch (e) {
          document.documentElement.classList.toggle(
            'hub-dark',
            window.matchMedia('(prefers-color-scheme: dark)').matches,
          );
        }
      })();
    </script>
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Angular events and calls for papers"
      href="/feed.xml"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="preload"
      href="fonts/jersey-10-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
