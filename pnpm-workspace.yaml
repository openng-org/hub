packages:
  - 'apps/*'
  - 'packages/*'

# Native/optional post-install scripts the Angular toolchain relies on (pnpm blocks the rest).
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# One version per shared dependency; workspace packages reference them with "catalog:".
catalog:
  # Angular — bump here, everything follows.
  '@angular/animations': '^22.2.0'
  '@angular/cdk': '^22.2.0'
  '@angular/common': '^22.2.0'
  '@angular/compiler': '^22.2.0'
  '@angular/compiler-cli': '^22.2.0'
  '@angular/core': '^22.2.0'
  '@angular/forms': '^22.2.0'
  '@angular/platform-browser': '^22.2.0'
  '@angular/platform-server': '^22.2.0'
  '@angular/router': '^22.2.0'
  '@angular/build': '^22.2.5'
  '@angular/cli': '^22.2.5'
  '@angular/ssr': '^22.2.5'
  'rxjs': '~7.8.0'
  'tslib': '^2.9.1'
  # Tooling
  'typescript': '~7.0.2'
  'semver': '^7.8.6'
  '@types/semver': '^7.7.0'
  '@types/node': '^26.6.6'
  'vitest': '^5.1.0'
  '@vitest/coverage-v8': '^5.1.0'
  'jsdom': '^31.0.1'
  'prettier': '^3.10.1'
  'tsup': '^9.0.0'
